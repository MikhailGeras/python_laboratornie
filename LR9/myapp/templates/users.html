{% extends "base.html" %}

{% block content %}
<h1>Пользователи</h1>

<table class="table table-striped">
    <tr>
        <th>ID</th><th>Имя</th><th>Профиль</th>
    </tr>
    {% for u in users %}
        <tr>
            <td>{{ u.id }}</td>
            <td>{{ u.name }}</td>
            <td><a href="/user?id={{ u.id }}">Открыть</a></td>
        </tr>
    {% endfor %}
</table>
{% endblock %}
